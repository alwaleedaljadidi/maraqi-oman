const ROUTES={"shams":{"access":{"ar":"من الحمراء، اصعد طريق جبل شمس مرورًا بغول حتى نهاية الطريق عند قرية الخطيم (نحو 1,900 م). يُنصح بسيارة دفع رباعي، خاصة بعد المطر. اركن قرب دورات المياه ولوحة المسار.","en":"From Al Hamra, drive up the Jebel Shams road via Ghul to the end of the road at Al Khitaym village (about 1,900 m). A 4x4 is recommended, especially after rain. Park near the toilets and the trail signboard.","de":"Fahr von Al Hamra die Jebel-Shams-Straße über Ghul hinauf bis zum Straßenende am Dorf Al Khitaym (ca. 1.900 m). Ein Allradfahrzeug (4x4) wird empfohlen, besonders nach Regen. Park in der Nähe der Toiletten und der Wegtafel.","fr":"Depuis Al Hamra, montez par la route du Jebel Shams via Ghul jusqu’au bout de la route, au village d’Al Khitaym (environ 1 900 m). Un 4x4 est recommandé, surtout après la pluie. Garez-vous près des toilettes et du panneau du sentier.","ru":"Из Эль-Хамры поднимитесь по дороге на Джебель-Шамс через Гул до конца дороги у деревни Эль-Хитайм (около 1900 м). Рекомендуется внедорожник, особенно после дождя. Оставьте машину у туалетов и информационного щита тропы."},"back":{"ar":"عُد من الطريق نفسه إلى الخطيم. هذا مسار ذهاب وعودة، وليس مسارًا دائريًا.","en":"Return the same way to Al Khitaym. This is an out-and-back walk, not a loop.","de":"Geh auf demselben Weg zurück nach Al Khitaym. Das ist eine Hin-und-zurück-Wanderung, keine Rundtour.","fr":"Revenez par le même chemin jusqu’à Al Khitaym. Il s’agit d’un aller-retour, pas d’une boucle.","ru":"Возвращайтесь тем же путём в Эль-Хитайм. Это маршрут «туда и обратно», а не кольцевой."},"tip":{"ar":"ابدأ في الصباح الباكر، واحمل لترين من الماء على الأقل لكل شخص. لا يوجد ظل ولا ماء على الطريق.","en":"Start early in the morning and carry at least 2 litres of water per person. There is no shade or water on the way.","de":"Starte früh am Morgen und nimm mindestens 2 Liter Wasser pro Person mit. Unterwegs gibt es weder Schatten noch Wasser.","fr":"Partez tôt le matin et emportez au moins 2 litres d’eau par personne. Il n’y a ni ombre ni eau en chemin.","ru":"Выходите рано утром и возьмите не менее 2 литров воды на человека. На маршруте нет ни тени, ни воды."},"steps":[{"t":{"ar":"بداية المسار في الخطيم","en":"Al Khitaym trailhead","de":"Ausgangspunkt Al Khitaym","fr":"Départ d’Al Khitaym","ru":"Начало тропы в Эль-Хитайме"},"d":{"ar":"ابدأ من اللوحة المجاورة لدورات المياه، واتبع علامات الطلاء الأصفر والأبيض والأحمر وأكوام الحجارة نحو حافة الوادي.","en":"Start at the signboard next to the toilets and follow the yellow-white-red paint marks and cairns towards the canyon edge.","de":"Starte an der Tafel neben den Toiletten und folge den gelb-weiß-roten Markierungen und Steinmännchen in Richtung Canyonrand.","fr":"Partez du panneau à côté des toilettes et suivez les marques peintes jaune-blanc-rouge et les cairns en direction du bord du canyon.","ru":"Начните у щита рядом с туалетами и идите по жёлто-бело-красной маркировке и каменным турам к краю каньона."},"tm":[5,10,"m"]},{"t":{"ar":"النزول إلى الشرفة الصخرية","en":"Down onto the balcony ledge","de":"Hinab auf den Balkonpfad","fr":"Descente vers la corniche","ru":"Спуск на карниз-«балкон»"},"d":{"ar":"ينحدر المسار إلى حافة صخرية على جانب وادي النخر. الأرض صخرية، وعلى أحد الجانبين هاوية عمودية.","en":"The path drops onto a ledge on the side of Wadi An Nakhur. The ground is rocky, with a sheer drop on one side.","de":"Der Weg führt hinunter auf ein Felsband an der Flanke des Wadi An Nakhur. Der Boden ist felsig, auf einer Seite geht es senkrecht hinab.","fr":"Le sentier descend sur une corniche à flanc du Wadi An Nakhur. Le sol est rocailleux, avec un à-pic vertigineux d’un côté.","ru":"Тропа спускается на карниз на склоне вади Эн-Нахур. Под ногами камни, с одной стороны — отвесный обрыв."},"tm":[20,30,"m"]},{"t":{"ar":"على طول الحافة الصخرية","en":"Along the cliff ledge","de":"Entlang des Felsbands","fr":"Le long de la corniche","ru":"По карнизу вдоль скалы"},"d":{"ar":"اتبع الحافة بمحاذاة جدار الوادي، وأغلبها نزول خفيف. ابتعد عن الحافة، خاصة عند التصوير.","en":"Follow the ledge along the canyon wall, mostly gently downhill. Keep away from the edge, especially when taking photos.","de":"Folge dem Felsband entlang der Canyonwand, meist leicht bergab. Halte Abstand zur Kante, besonders beim Fotografieren.","fr":"Suivez la corniche le long de la paroi du canyon, en légère descente la plupart du temps. Restez à l’écart du bord, surtout pour prendre des photos.","ru":"Идите по карнизу вдоль стены каньона, в основном с пологим спуском. Держитесь подальше от края, особенно когда фотографируете."},"tm":[40,60,"m"]},{"t":{"ar":"قرية السب المهجورة","en":"Abandoned village of As Sab","de":"Verlassenes Dorf As Sab","fr":"Village abandonné d’As Sab","ru":"Заброшенная деревня Эс-Саб"},"d":{"ar":"تصل إلى بيوت السب الحجرية المهدمة، المبنية تحت بروز صخري في الجرف، ومعها مدرجات زراعية قديمة. لا توجد أي مرافق هنا.","en":"Reach the ruined stone houses of As Sab, built under an overhang of the cliff, with old farm terraces. There are no facilities here.","de":"Du erreichst die verfallenen Steinhäuser von As Sab, gebaut unter einem Felsüberhang, mit alten Feldterrassen. Hier gibt es keinerlei Einrichtungen.","fr":"Vous atteignez les maisons en pierre en ruine d’As Sab, construites sous un surplomb de la falaise, avec d’anciennes terrasses cultivées. Il n’y a aucun équipement ici.","ru":"Вы дойдёте до разрушенных каменных домов Эс-Саба, построенных под скальным навесом, и старых сельскохозяйственных террас. Никакой инфраструктуры здесь нет."},"tm":[20,30,"m"]},{"t":{"ar":"الصعود في طريق العودة","en":"Climb back","de":"Rückweg bergauf","fr":"Remontée","ru":"Обратный подъём"},"d":{"ar":"عُد على الحافة نفسها. أغلب الطريق صعود وتحت الشمس، لذا فهو النصف الأصعب من المشي.","en":"Return along the same ledge. It is mostly uphill and in the sun, so it is the harder half of the walk.","de":"Geh auf demselben Felsband zurück. Es geht überwiegend bergauf und in der Sonne, daher ist das die anstrengendere Hälfte der Wanderung.","fr":"Revenez par la même corniche. Le retour est surtout en montée et au soleil : c’est la moitié la plus difficile de la randonnée.","ru":"Возвращайтесь по тому же карнизу. Путь идёт в основном в гору и по солнцу, поэтому это более тяжёлая половина маршрута."},"tm":[1.5,2,"h"]}]},"summit":{"access":{"ar":"اصعد طريق جبل شمس من الحمراء إلى الهضبة قرب منتجع جبل شمس هايتس، حيث توجد لوحة المسار W4. يستمر درب وعر مسافة قصيرة إلى موقف للسيارات، ويُنصح بسيارة دفع رباعي.","en":"Drive up the Jebel Shams road from Al Hamra to the plateau near the Jebel Shams Heights resort, where there is a W4 signpost. A rough track continues a short way to a parking spot; a 4x4 is recommended.","de":"Fahr von Al Hamra die Jebel-Shams-Straße hinauf zur Hochebene beim Resort Jebel Shams Heights, wo ein W4-Wegweiser steht. Eine holprige Piste führt noch ein kurzes Stück weiter zu einem Parkplatz; ein Allradfahrzeug (4x4) wird empfohlen.","fr":"Montez par la route du Jebel Shams depuis Al Hamra jusqu’au plateau, près du complexe Jebel Shams Heights, où se trouve un poteau indicateur W4. Une piste accidentée continue sur une courte distance jusqu’à un parking ; un 4x4 est recommandé.","ru":"Поднимитесь по дороге на Джебель-Шамс из Эль-Хамры до плато у курорта Jebel Shams Heights, где стоит указатель W4. Дальше грунтовка ведёт ещё немного до парковки; рекомендуется внедорожник."},"back":{"ar":"عُد من المسار المعلَّم نفسه. يمكنك إنجازه في يوم واحد طويل، أو في يومين مع المبيت على الهضبة.","en":"Retrace the same marked route. You can do it in one long day or over two days with a night on the plateau.","de":"Geh die gleiche markierte Route zurück. Du kannst sie an einem langen Tag schaffen oder auf zwei Tage mit einer Übernachtung auf der Hochebene verteilen.","fr":"Revenez par le même itinéraire balisé. Vous pouvez le faire en une longue journée ou en deux jours avec une nuit sur le plateau.","ru":"Возвращайтесь тем же маркированным маршрутом. Его можно пройти за один долгий день или за два дня с ночёвкой на плато."},"tip":{"ar":"ابدأ قبل الساعة 5–6 صباحًا، واحمل 6 لترات من الماء على الأقل لكل شخص. من نوفمبر إلى مارس قد تنخفض الحرارة في القمة إلى ما دون الصفر، فأحضر ملابس دافئة.","en":"Start by 5–6 am and carry at least 6 litres of water per person. From November to March it can be below freezing at the top, so bring warm layers.","de":"Starte bis 5–6 Uhr morgens und nimm mindestens 6 Liter Wasser pro Person mit. Von November bis März kann es oben unter null Grad haben, pack also warme Kleidung ein.","fr":"Partez vers 5 h – 6 h et emportez au moins 6 litres d’eau par personne. De novembre à mars, il peut geler au sommet : prévoyez des vêtements chauds.","ru":"Выходите не позже 5–6 утра и возьмите не менее 6 литров воды на человека. С ноября по март на вершине бывает мороз, поэтому возьмите тёплые слои одежды."},"steps":[{"t":{"ar":"عبور الوادي","en":"Cross the wadi","de":"Das Wadi durchqueren","fr":"Traversée du wadi","ru":"Переход через вади"},"d":{"ar":"من لوحة W4، اعبر مجرى الوادي الجاف قرب السد القديم واتجه نحو الشمال الشرقي. تمتد علامات الطلاء الأصفر والأبيض والأحمر حتى القمة.","en":"From the W4 signpost, cross the dry riverbed near the old dam and head north-east. Yellow-white-red marks run all the way to the summit.","de":"Überquere vom W4-Wegweiser aus das trockene Flussbett beim alten Damm und halte dich Richtung Nordosten. Gelb-weiß-rote Markierungen führen bis zum Gipfel.","fr":"Depuis le poteau W4, traversez le lit de rivière asséché près de l’ancien barrage et partez vers le nord-est. Les marques jaune-blanc-rouge mènent jusqu’au sommet.","ru":"От указателя W4 перейдите сухое русло у старой плотины и идите на северо-восток. Жёлто-бело-красная маркировка ведёт до самой вершины."},"tm":[15,20,"m"]},{"t":{"ar":"إلى مطل حافة الوادي","en":"To the rim viewpoint","de":"Zum Aussichtspunkt am Rand","fr":"Vers le belvédère du bord","ru":"К смотровой площадке на краю каньона"},"d":{"ar":"مشي سهل بين أودية صغيرة وتلال منخفضة يوصلك إلى مطل على حافة الوادي.","en":"Easy walking through small canyons and low hills brings you to a viewpoint on the canyon rim.","de":"Leichtes Gehen durch kleine Schluchten und niedrige Hügel bringt dich zu einem Aussichtspunkt am Canyonrand.","fr":"Une marche facile à travers de petits canyons et des collines basses vous amène à un point de vue sur le bord du canyon.","ru":"Лёгкая ходьба через небольшие ущелья и невысокие холмы приведёт вас к смотровой площадке на краю каньона."},"tm":[1,1.5,"h"]},{"t":{"ar":"صعود متواصل بمحاذاة الحافة","en":"Steady climb along the rim","de":"Stetiger Anstieg am Rand","fr":"Montée régulière le long du bord","ru":"Равномерный подъём вдоль края"},"d":{"ar":"اصعد بثبات بجانب هاويات عميقة نحو الوادي، مرورًا بأشجار العلعلان، حتى هضبة صغيرة على ارتفاع نحو 2,500 م.","en":"Climb steadily beside huge drops into the canyon, past juniper trees, to a small plateau at about 2,500 m.","de":"Steig stetig neben gewaltigen Abgründen in den Canyon an, vorbei an Wacholderbäumen, bis zu einer kleinen Hochebene auf etwa 2.500 m.","fr":"Montez régulièrement le long d’immenses à-pics au-dessus du canyon, en passant devant des genévriers, jusqu’à un petit plateau vers 2 500 m.","ru":"Поднимайтесь вдоль огромных обрывов в каньон, мимо можжевельников, к небольшому плато на высоте около 2500 м."},"tm":[1.5,2,"h"]},{"t":{"ar":"الانعطاف جنوبًا أسفل المنطقة العسكرية","en":"Turn south below the military zone","de":"Unterhalb des Militärgebiets nach Süden","fr":"Virage au sud sous la zone militaire","ru":"Поворот на юг под военной зоной"},"d":{"ar":"أسفل المنشآت العسكرية على القمة الشمالية، ينعطف المسار بحدة نحو الجنوب. الدخول إلى القمة الشمالية ممنوع، فالتزم بالمسار المعلَّم.","en":"Below the military installations on the north summit, the route turns sharply south. The north summit is off-limits, so stay on the marked path.","de":"Unterhalb der militärischen Anlagen auf dem Nordgipfel knickt die Route scharf nach Süden ab. Der Nordgipfel ist gesperrt, also bleib auf dem markierten Weg.","fr":"Sous les installations militaires du sommet nord, l’itinéraire tourne brusquement vers le sud. Le sommet nord est interdit d’accès : restez sur le sentier balisé.","ru":"Под военными объектами на северной вершине маршрут резко поворачивает на юг. Северная вершина закрыта для посещения, поэтому не сходите с маркированной тропы."},"tm":[15,30,"m"]},{"t":{"ar":"إلى القمة الجنوبية","en":"To the south summit","de":"Zum Südgipfel","fr":"Vers le sommet sud","ru":"К южной вершине"},"d":{"ar":"اعبر هضابًا صغيرة وشعابًا، مع بعض التسلق باليدين، حتى القمة الجنوبية (نحو 3,000 م)، وعليها كومة حجارة وعَلَم.","en":"Cross small plateaus and gullies, with some scrambling, to the south summit (about 3,000 m), marked with a cairn and a flag.","de":"Überquere kleine Hochflächen und Rinnen, teils mit leichter Kletterei, bis zum Südgipfel (ca. 3.000 m), markiert mit einem Steinmann und einer Fahne.","fr":"Traversez de petits plateaux et des ravines, avec quelques passages d’escalade facile, jusqu’au sommet sud (environ 3 000 m), signalé par un cairn et un drapeau.","ru":"Пересеките небольшие плато и лощины, местами с лазанием, до южной вершины (около 3000 м), отмеченной туром и флагом."},"tm":[1.5,2.5,"h"]},{"t":{"ar":"النزول","en":"Descent","de":"Abstieg","fr":"Descente","ru":"Спуск"},"d":{"ar":"انزل من المسار المعلَّم نفسه. السير على الصخور المفككة بأرجل متعبة بطيء، فاترك وقتًا كافيًا قبل حلول الظلام.","en":"Go back down the same marked route. Tired legs on loose rock are slow, so leave plenty of daylight.","de":"Steig auf derselben markierten Route wieder ab. Mit müden Beinen auf losem Geröll kommst du nur langsam voran, also plane genug Tageslicht ein.","fr":"Redescendez par le même itinéraire balisé. Avec des jambes fatiguées sur des pierres instables, on avance lentement : prévoyez largement assez de jour.","ru":"Спускайтесь по тому же маркированному маршруту. Усталые ноги на осыпающихся камнях идут медленно, поэтому оставьте достаточный запас светлого времени."},"tm":[3.5,4.5,"h"]}]},"bimah":{"access":{"ar":"سيارة الدفع الرباعي ضرورية. من الحمراء، اعبر ممر شرفة العلمين وانزل الدرب الجبلي نحو بلد سيت وبيمة. ينتهي الوادي عند الزامة في وادي بني عوف، لذا تحتاج إلى سيارة ثانية تنتظرك هناك أو إلى مرشد محلي.","en":"A 4x4 is essential. From Al Hamra, drive over the Sharafat Al Alamayn pass and down the mountain track towards Balad Sayt and Bimah. The canyon ends at Az Zammah in Wadi Bani Awf, so you need a second car waiting there or a local guide.","de":"Ein Allradfahrzeug (4x4) ist unverzichtbar. Fahr von Al Hamra über den Pass Sharafat Al Alamayn und die Bergpiste hinunter Richtung Balad Sayt und Bimah. Der Canyon endet in Az Zammah im Wadi Bani Awf, daher brauchst du dort ein zweites wartendes Auto oder einen einheimischen Guide.","fr":"Un 4x4 est indispensable. Depuis Al Hamra, franchissez le col de Sharafat Al Alamayn puis descendez la piste de montagne vers Balad Sayt et Bimah. Le canyon se termine à Az Zammah, dans le Wadi Bani Awf : il vous faut donc une seconde voiture qui vous y attend, ou un guide local.","ru":"Внедорожник обязателен. Из Эль-Хамры переедьте перевал Шарафат-эль-Аламейн и спуститесь по горной грунтовке к Балад-Сайту и Биме. Каньон заканчивается в Эз-Замме в вади Бани-Ауф, поэтому там вас должна ждать вторая машина или местный гид."},"back":{"ar":"هذا مسار باتجاه واحد: التقِ بسيارتك الثانية أو بالمرشد في الزامة. لا يمكنك العودة صعودًا عبر الوادي.","en":"This is a one-way route: meet your second car or guide at Az Zammah. You cannot go back up the canyon.","de":"Das ist eine Einweg-Route: Triff dein zweites Auto oder deinen Guide in Az Zammah. Du kannst den Canyon nicht wieder hinaufgehen.","fr":"Cet itinéraire est à sens unique : retrouvez votre seconde voiture ou votre guide à Az Zammah. Il est impossible de remonter le canyon.","ru":"Это маршрут в одну сторону: вторая машина или гид встречают вас в Эз-Замме. Подняться обратно по каньону невозможно."},"tip":{"ar":"هذا نزول أودية وليس مشيًا عاديًا: لا تذهب إلا مع مرشد، ومع خوذة ومهارة في السباحة. لا تدخل أبدًا إذا توقعت الأرصاد مطرًا في أي مكان من الجبال.","en":"This is canyoning, not a normal walk: go only with a guide, a helmet and swimming skills. Never enter if rain is forecast anywhere in the mountains.","de":"Das ist Canyoning, keine normale Wanderung: Geh nur mit Guide, Helm und sicheren Schwimmkenntnissen. Steig niemals ein, wenn irgendwo in den Bergen Regen vorhergesagt ist.","fr":"Il s’agit de canyoning, pas d’une randonnée ordinaire : n’y allez qu’avec un guide, un casque et en sachant nager. N’y entrez jamais si de la pluie est annoncée où que ce soit dans les montagnes.","ru":"Это каньонинг, а не обычная прогулка: идите только с гидом, в каске и умея плавать. Никогда не заходите в каньон, если где-либо в горах ожидается дождь."},"steps":[{"t":{"ar":"دخول مجرى الوادي","en":"Enter the streambed","de":"Ins Bachbett","fr":"Entrée dans le lit du torrent","ru":"Вход в русло"},"d":{"ar":"من الدرب القريب من بيمة، ادخل مجرى الحصى الواسع واتبعه مع اتجاه الجريان حتى تضيق الجدران.","en":"From the track near Bimah, walk into the wide gravel streambed and follow it downstream until the walls close in.","de":"Geh von der Piste bei Bimah in das breite Kiesbachbett und folge ihm bachabwärts, bis die Wände enger werden.","fr":"Depuis la piste près de Bimah, descendez dans le large lit de graviers et suivez-le vers l’aval jusqu’à ce que les parois se resserrent.","ru":"От грунтовки у Бимы выйдите в широкое галечное русло и идите вниз по течению, пока стены не сомкнутся."},"tm":[15,20,"m"]},{"t":{"ar":"نقطة اللاعودة","en":"Point of no return","de":"Punkt ohne Wiederkehr","fr":"Point de non-retour","ru":"Точка невозврата"},"d":{"ar":"يضيق الوادي، وهناك نزول قصير أو قفزة في بركة (نحو 3 م). بعد هذه النقطة لا يمكنك الصعود والخروج.","en":"The gorge narrows and there is a short drop or jump into a pool (about 3 m). After this point you cannot climb back out.","de":"Die Schlucht wird enger, und es folgt ein kurzer Abstieg oder Sprung in einen Pool (ca. 3 m). Ab hier kannst du nicht mehr zurückklettern.","fr":"La gorge se rétrécit et il faut descendre ou sauter dans une vasque (environ 3 m). Après ce point, impossible de remonter.","ru":"Ущелье сужается, и нужно спуститься или спрыгнуть в заводь (около 3 м). После этого места выбраться обратно наверх невозможно."},"tm":[30,45,"m"]},{"t":{"ar":"برك وقفزات وسباحة","en":"Pools, jumps and swims","de":"Pools, Sprünge und Schwimmen","fr":"Vasques, sauts et nage","ru":"Заводи, прыжки и заплывы"},"d":{"ar":"تابع عبر سلسلة من البرك، مع سباحة وقفزات قصيرة وانزلاقات صخرية وتسلق على صخور ملساء زلقة.","en":"Continue through a series of pools with swimming, short jumps, rock slides and scrambling on slippery polished rock.","de":"Weiter geht es durch eine Reihe von Pools mit Schwimmen, kurzen Sprüngen, Felsrutschen und Kraxeln auf rutschigem, glatt geschliffenem Fels.","fr":"Continuez à travers une série de vasques avec de la nage, de petits sauts, des toboggans naturels et de l’escalade facile sur une roche polie et glissante.","ru":"Дальше идёт череда заводей: плавание, короткие прыжки, скальные горки и лазание по скользкому отполированному камню."},"tm":[45,60,"m"]},{"t":{"ar":"النفق الصخري","en":"The rock tunnel","de":"Der Felstunnel","fr":"Le tunnel rocheux","ru":"Скальный тоннель"},"d":{"ar":"يلتقي فرعك بوادي بني عوف الرئيسي. اسبح أو اخُض الماء عبر الكهف الشبيه بالنفق، وهو أبرز ما في الوادي.","en":"Your branch joins the main Wadi Bani Awf gorge. Swim or wade through the tunnel-like cave, the highlight of the canyon.","de":"Dein Seitenarm mündet in die Hauptschlucht des Wadi Bani Awf. Schwimm oder wate durch die tunnelartige Höhle, das Highlight des Canyons.","fr":"Votre branche rejoint la gorge principale du Wadi Bani Awf. Traversez à la nage ou en marchant dans l’eau la grotte en forme de tunnel, le clou du canyon.","ru":"Ваше ответвление выходит в главное ущелье вади Бани-Ауф. Проплывите или пройдите вброд через пещеру-тоннель — главное впечатление каньона."},"tm":[20,30,"m"]},{"t":{"ar":"الخروج إلى الزامة","en":"Exit to Az Zammah","de":"Ausstieg nach Az Zammah","fr":"Sortie vers Az Zammah","ru":"Выход к Эз-Замме"},"d":{"ar":"ينفتح الوادي على أرض جافة. اخرج واتبع الدرب مع اتجاه الجريان حتى الزامة.","en":"The canyon opens onto dry ground. Walk out and follow the track downstream to Az Zammah.","de":"Der Canyon öffnet sich auf trockenen Boden. Geh hinaus und folge der Piste bachabwärts nach Az Zammah.","fr":"Le canyon débouche sur un terrain sec. Sortez-en et suivez la piste vers l’aval jusqu’à Az Zammah.","ru":"Каньон выводит на сухое место. Выйдите из него и идите по грунтовке вниз по течению до Эз-Заммы."},"tm":[30,40,"m"]}]},"akhdar":{"access":{"ar":"من نزوى، اتجه إلى بركة الموز ثم اصعد طريق الجبل الأخضر حتى نقطة تفتيش الشرطة، ولا يُسمح بعدها إلا لسيارات الدفع الرباعي. على الهضبة، اتبع اللوحات نحو نقطة ديانا، ثم انعطف إلى العقر، وابدأ حيث ينتهي الطريق عند طرف القرية (المسار W18b).","en":"From Nizwa, drive to Birkat Al Mawz and up the Jebel Akhdar road to the police checkpoint, where only 4x4 vehicles may continue. On the plateau, follow the signs towards Diana's Point, turn to Al Aqr, and start where the road ends at the edge of the village (route W18b).","de":"Fahr von Nizwa nach Birkat Al Mawz und die Jebel-Akhdar-Straße hinauf bis zum Polizeikontrollpunkt, ab dem nur Allradfahrzeuge (4x4) weiterfahren dürfen. Folge auf der Hochebene den Schildern Richtung Diana's Point, bieg nach Al Aqr ab und starte dort, wo die Straße am Dorfrand endet (Route W18b).","fr":"Depuis Nizwa, rejoignez Birkat Al Mawz puis montez par la route du Jebel Akhdar jusqu’au poste de police, au-delà duquel seuls les 4x4 peuvent continuer. Sur le plateau, suivez les panneaux vers Diana’s Point, tournez vers Al Aqr et partez de l’endroit où la route se termine, à l’entrée du village (itinéraire W18b).","ru":"Из Низвы доедьте до Биркат-эль-Мауза и поднимитесь по дороге на Джебель-Ахдар до полицейского поста, дальше которого пропускают только внедорожники. На плато следуйте указателям на смотровую площадку Дианы (Diana's Point), сверните к Эль-Акру и начните маршрут там, где дорога заканчивается на краю деревни (маршрут W18b)."},"back":{"ar":"يعود أغلب الناس من الطريق نفسه من الشريجة إلى العقر.","en":"Most people walk back the same way from Ash Shirayjah to Al Aqr.","de":"Die meisten gehen denselben Weg von Ash Shirayjah zurück nach Al Aqr.","fr":"La plupart des randonneurs reviennent par le même chemin d’Ash Shirayjah à Al Aqr.","ru":"Большинство возвращается тем же путём из Эш-Шираджи в Эль-Акр."},"tip":{"ar":"هذه قرى مأهولة ومزارع خاصة: التزم بالمسار، والبس لباسًا محتشمًا، ولا تقطف الورد أو الثمار. موسم الورد من أواخر مارس إلى أبريل.","en":"These are working villages and private farms: stay on the path, dress modestly and do not pick roses or fruit. Late March to April is rose season.","de":"Das sind bewohnte Dörfer und private Felder: Bleib auf dem Weg, kleide dich zurückhaltend und pflück keine Rosen oder Früchte. Von Ende März bis April ist Rosensaison.","fr":"Ces villages sont habités et les cultures sont privées : restez sur le sentier, portez une tenue correcte et ne cueillez ni roses ni fruits. La saison des roses va de fin mars à avril.","ru":"Это жилые деревни и частные фермы: не сходите с тропы, одевайтесь скромно и не срывайте розы и фрукты. Сезон роз — с конца марта по апрель."},"steps":[{"t":{"ar":"العقر","en":"Al Aqr","de":"Al Aqr","fr":"Al Aqr","ru":"Эль-Акр"},"d":{"ar":"اتبع علامات الطلاء الأصفر والأبيض والأحمر نزولًا على درجات حجرية إلى قرية العقر ومدرجاتها.","en":"Follow the yellow-white-red marks down stone steps into the village of Al Aqr and its terraces.","de":"Folge den gelb-weiß-roten Markierungen über Steinstufen hinunter ins Dorf Al Aqr und zu seinen Terrassen.","fr":"Suivez les marques jaune-blanc-rouge qui descendent des marches en pierre jusqu’au village d’Al Aqr et à ses terrasses.","ru":"Следуя жёлто-бело-красной маркировке, спуститесь по каменным ступеням в деревню Эль-Акр к её террасам."},"tm":[10,15,"m"]},{"t":{"ar":"من المدرجات إلى العين","en":"Terraces to Al Ayn","de":"Über die Terrassen nach Al Ayn","fr":"Des terrasses à Al Ayn","ru":"По террасам до Эль-Айна"},"d":{"ar":"امشِ في الدرب القديم عبر مدرجات الورد والرمان، مع درجات شديدة الانحدار وإطلالات على الوادي، حتى العين.","en":"Walk the old path across terraces of roses and pomegranates, with steep steps and views into the gorge, to Al Ayn.","de":"Geh auf dem alten Pfad über Terrassen mit Rosen und Granatäpfeln, mit steilen Stufen und Blicken in die Schlucht, nach Al Ayn.","fr":"Empruntez l’ancien chemin à travers les terrasses de rosiers et de grenadiers, avec des marches raides et des vues sur la gorge, jusqu’à Al Ayn.","ru":"Идите старой тропой через террасы с розами и гранатами, по крутым ступеням и с видами на ущелье, до Эль-Айна."},"tm":[20,30,"m"]},{"t":{"ar":"بمحاذاة الفلج","en":"Along the falaj","de":"Entlang des Falaj","fr":"Le long du falaj","ru":"Вдоль фаладжа"},"d":{"ar":"حول العين يسير الدرب بجانب قناة فلج ضيقة. امشِ بحذر على حافتها ولا تطأ الماء.","en":"Around Al Ayn the path runs beside a narrow falaj channel. Walk carefully on its edge and do not step into the water.","de":"Rund um Al Ayn verläuft der Weg neben einem schmalen Falaj-Kanal. Geh vorsichtig auf seinem Rand und tritt nicht ins Wasser.","fr":"Autour d’Al Ayn, le sentier longe un étroit canal de falaj. Marchez prudemment sur son bord et ne mettez pas les pieds dans l’eau.","ru":"У Эль-Айна тропа идёт вдоль узкого канала фаладжа. Осторожно идите по его краю и не наступайте в воду."},"tm":[15,20,"m"]},{"t":{"ar":"الشريجة","en":"Ash Shirayjah","de":"Ash Shirayjah","fr":"Ash Shirayjah","ru":"Эш-Шираджа"},"d":{"ar":"تابع إلى الشريجة، حيث تقوم بيوتها الحجرية القديمة فوق المدرجات. هذه هي نقطة العودة المعتادة.","en":"Continue to Ash Shirayjah, whose old stone houses sit above the terraces. This is the usual turnaround point.","de":"Weiter nach Ash Shirayjah, dessen alte Steinhäuser über den Terrassen liegen. Hier kehren die meisten um.","fr":"Continuez jusqu’à Ash Shirayjah, dont les vieilles maisons en pierre dominent les terrasses. C’est là que l’on fait habituellement demi-tour.","ru":"Продолжайте путь до Эш-Шираджи, старые каменные дома которой стоят над террасами. Обычно здесь поворачивают обратно."},"tm":[15,20,"m"]},{"t":{"ar":"اختياري: الصعود إلى سيق","en":"Optional: up to Sayq","de":"Optional: hinauf nach Sayq","fr":"En option : montée à Sayq","ru":"По желанию: подъём в Сайк"},"d":{"ar":"يستمر المسار المعلَّم عبر وادٍ صخري صغير صعودًا إلى سيق على الهضبة. رتّب من يقلّك من هناك إذا واصلت.","en":"The marked path continues through a small rocky gorge up to Sayq on the plateau. Arrange a pickup there if you go on.","de":"Der markierte Weg führt weiter durch eine kleine felsige Schlucht hinauf nach Sayq auf der Hochebene. Organisier dort eine Abholung, wenn du weitergehst.","fr":"Le sentier balisé continue à travers une petite gorge rocheuse jusqu’à Sayq, sur le plateau. Si vous poursuivez, prévoyez quelqu’un pour venir vous chercher.","ru":"Маркированная тропа продолжается через небольшое скалистое ущелье вверх до Сайка на плато. Если пойдёте дальше, договоритесь, чтобы вас там забрали."},"tm":[45,60,"m"]}]},"shab":{"access":{"ar":"يقع وادي شاب بجوار طيوي على الطريق الساحلي بين مسقط وصور، على بعد نحو ساعة ونصف من مسقط. توجد لوحات إرشادية، ويؤدي طريق معبد إلى موقف مجاني تحت جسر الطريق السريع. يمكن الوصول بأي سيارة.","en":"Wadi Shab is next to Tiwi on the Muscat–Sur coastal highway, about 1.5 hours from Muscat. It is signposted, and a paved road leads to a free car park under the highway bridge. Any car can get there.","de":"Das Wadi Shab liegt neben Tiwi an der Küstenschnellstraße Muscat–Sur, etwa 1,5 Stunden von Muscat entfernt. Es ist ausgeschildert, und eine asphaltierte Straße führt zu einem kostenlosen Parkplatz unter der Autobahnbrücke. Du kommst mit jedem Auto hin.","fr":"Le Wadi Shab se trouve à côté de Tiwi, sur l’autoroute côtière Mascate–Sour, à environ 1 h 30 de Mascate. Il est indiqué, et une route goudronnée mène à un parking gratuit sous le pont de l’autoroute. Toute voiture peut s’y rendre.","ru":"Вади Шаб находится рядом с Тиви на прибрежном шоссе Маскат — Сур, примерно в 1,5 часа езды от Маската. Есть указатели, а асфальтированная дорога ведёт к бесплатной парковке под мостом шоссе. Добраться можно на любой машине."},"back":{"ar":"عُد من الطريق نفسه إلى المرسى، واركب القارب عائدًا إلى الموقف.","en":"Go back the same way to the landing and take the boat back to the car park.","de":"Geh denselben Weg zurück zur Anlegestelle und nimm das Boot zurück zum Parkplatz.","fr":"Revenez par le même chemin jusqu’à l’embarcadère et reprenez le bateau jusqu’au parking.","ru":"Возвращайтесь тем же путём к пристани и переправьтесь на лодке обратно к парковке."},"tip":{"ar":"البس أحذية مائية، واحفظ هاتفك ومفاتيحك في حقيبة مقاومة للماء. على من لا يجيد السباحة التوقف عند البركة الأولى.","en":"Wear water shoes and keep your phone and keys in a dry bag. Non-swimmers should stop at the first pool.","de":"Trag Wasserschuhe und pack Handy und Schlüssel in einen wasserdichten Beutel. Nichtschwimmer sollten am ersten Pool bleiben.","fr":"Portez des chaussures aquatiques et gardez téléphone et clés dans un sac étanche. Si vous ne savez pas nager, arrêtez-vous à la première vasque.","ru":"Наденьте обувь для воды, а телефон и ключи держите в гермомешке. Тем, кто не умеет плавать, лучше остановиться у первой заводи."},"steps":[{"t":{"ar":"العبور بالقارب","en":"Boat crossing","de":"Bootsüberfahrt","fr":"Traversée en bateau","ru":"Переправа на лодке"},"d":{"ar":"من الموقف، اركب أحد القوارب الصغيرة لعبور مصب الوادي. يستغرق العبور دقيقتين تقريبًا، والأجرة تُدفع نقدًا.","en":"From the car park, take one of the small boats across the mouth of the wadi. The crossing takes a couple of minutes, and the fare is paid in cash.","de":"Nimm vom Parkplatz aus eines der kleinen Boote über die Mündung des Wadis. Die Überfahrt dauert ein paar Minuten, bezahlt wird bar.","fr":"Depuis le parking, prenez l’un des petits bateaux pour traverser l’embouchure du wadi. La traversée dure quelques minutes et se paie en espèces.","ru":"От парковки переправьтесь на одной из небольших лодок через устье вади. Переправа занимает пару минут, оплата наличными."},"tm":[5,10,"m"]},{"t":{"ar":"درب المزارع","en":"Plantation path","de":"Weg durch die Plantagen","fr":"Sentier des plantations","ru":"Тропа через плантации"},"d":{"ar":"اتبع الدرب المستوي عكس اتجاه الجريان، مرورًا بالنخيل والمزارع الصغيرة.","en":"Follow the flat path upstream past date palms and small farms.","de":"Folge dem flachen Weg flussaufwärts vorbei an Dattelpalmen und kleinen Feldern.","fr":"Suivez le sentier plat vers l’amont, entre palmiers dattiers et petites exploitations.","ru":"Идите по ровной тропе вверх по течению мимо финиковых пальм и небольших ферм."},"tm":[20,30,"m"]},{"t":{"ar":"جدران الوادي","en":"Canyon walls","de":"Canyonwände","fr":"Parois du canyon","ru":"Стены каньона"},"d":{"ar":"يضيق الدرب بمحاذاة جدران الوادي، مع درجة عالية تحتاج إلى صعود وقفز بين الصخور لتجنب الماء.","en":"The path narrows along the canyon walls, with a big step up and some boulder hopping to keep out of the water.","de":"Der Weg wird entlang der Canyonwände schmaler, mit einer großen Stufe nach oben und etwas Balancieren über Felsblöcke, um trocken zu bleiben.","fr":"Le sentier se rétrécit le long des parois du canyon, avec une grande marche à franchir et quelques sauts de rocher en rocher pour rester hors de l’eau.","ru":"Тропа сужается вдоль стен каньона: здесь есть высокая ступень и нужно прыгать по валунам, чтобы не зайти в воду."},"tm":[15,20,"m"]},{"t":{"ar":"الصخور والفلج","en":"Boulders and falaj","de":"Felsblöcke und Falaj","fr":"Rochers et falaj","ru":"Валуны и фаладж"},"d":{"ar":"اتبع الأسهم المرسومة بين الصخور، مرورًا بفلج قديم، حتى البركة الأولى.","en":"Follow the painted arrows through the boulders and past an old falaj to the first pool.","de":"Folge den aufgemalten Pfeilen durch die Felsblöcke und an einem alten Falaj vorbei bis zum ersten Pool.","fr":"Suivez les flèches peintes à travers les rochers, en passant près d’un ancien falaj, jusqu’à la première vasque.","ru":"Следуйте нарисованным стрелкам между валунами и мимо старого фаладжа к первой заводи."},"tm":[15,20,"m"]},{"t":{"ar":"البرك والكهف","en":"Pools and the cave","de":"Pools und die Höhle","fr":"Vasques et grotte","ru":"Заводи и пещера"},"d":{"ar":"من هنا عليك السباحة أو خوض الماء عبر عدة برك. عند البركة الأخيرة، تؤدي فتحة ضيقة إلى كهف فيه شلال: للسباحين الماهرين فقط.","en":"From here you must swim or wade through several pools. At the last pool, a narrow gap leads to a cave with a waterfall: strong swimmers only.","de":"Ab hier musst du durch mehrere Pools schwimmen oder waten. Am letzten Pool führt ein schmaler Spalt in eine Höhle mit Wasserfall: nur für sichere Schwimmer.","fr":"À partir d’ici, vous devez nager ou marcher dans l’eau à travers plusieurs vasques. À la dernière, un passage étroit mène à une grotte avec une cascade : réservé aux bons nageurs.","ru":"Дальше придётся плыть или идти вброд через несколько заводей. В последней заводи узкая щель ведёт в пещеру с водопадом: только для уверенных пловцов."},"tm":[25,35,"m"]}]},"tiwi":{"access":{"ar":"يقع مدخل وادي طيوي شمال بلدة طيوي مباشرة على طريق مسقط–صور السريع، على بعد نحو 2 كم من وادي شاب. الطريق السفلي مناسب لأي سيارة، أما أزقة القرى العليا الضيقة شديدة الانحدار فتحتاج إلى دفع رباعي. اركن في مكان واسع دون أن تسد طرق الأهالي.","en":"The Wadi Tiwi turn-off is just north of Tiwi town on the Muscat–Sur highway, about 2 km from Wadi Shab. The lower road is fine for any car, but the steep, narrow village lanes higher up need a 4x4. Park at a wide spot without blocking local lanes.","de":"Die Abzweigung zum Wadi Tiwi liegt kurz nördlich der Stadt Tiwi an der Schnellstraße Muscat–Sur, etwa 2 km vom Wadi Shab entfernt. Die untere Straße ist für jedes Auto geeignet, für die steilen, engen Dorfgassen weiter oben brauchst du aber ein Allradfahrzeug (4x4). Park an einer breiten Stelle, ohne die Gassen der Einheimischen zu blockieren.","fr":"L’embranchement du Wadi Tiwi se trouve juste au nord de la ville de Tiwi, sur l’autoroute Mascate–Sour, à environ 2 km du Wadi Shab. La route du bas convient à toute voiture, mais les ruelles étroites et raides des villages plus haut nécessitent un 4x4. Garez-vous à un endroit large sans bloquer les passages des habitants.","ru":"Съезд на вади Тиви находится сразу к северу от городка Тиви на шоссе Маскат — Сур, примерно в 2 км от вади Шаб. Нижняя дорога подходит для любой машины, но для крутых узких деревенских улочек выше нужен внедорожник. Оставьте машину на широком месте, не перекрывая местные проезды."},"back":{"ar":"اصعد الدرجات عائدًا إلى مبام، ثم عُد من الطريق نفسه نزولًا في الوادي.","en":"Climb back up the steps to Mibam and return the same way down the wadi.","de":"Steig die Stufen wieder hinauf nach Mibam und geh denselben Weg durch das Wadi zurück.","fr":"Remontez l’escalier jusqu’à Mibam et redescendez le wadi par le même chemin.","ru":"Поднимитесь по ступеням обратно в Мибам и возвращайтесь тем же путём вниз по вади."},"tip":{"ar":"غطِّ الركبتين والكتفين لأنك تمشي عبر القرى. ابدأ مبكرًا، فالسفوح قليلة الظل. يُنصح بمرشد محلي بعد مبام.","en":"Cover knees and shoulders, because you walk through villages. Start early: the hillsides have little shade. A local guide is recommended beyond Mibam.","de":"Bedeck Knie und Schultern, denn du gehst durch Dörfer. Starte früh: An den Hängen gibt es kaum Schatten. Hinter Mibam wird ein einheimischer Guide empfohlen.","fr":"Couvrez genoux et épaules, car vous traversez des villages. Partez tôt : les coteaux offrent peu d’ombre. Un guide local est recommandé au-delà de Mibam.","ru":"Закройте колени и плечи, так как маршрут проходит через деревни. Выходите рано: на склонах мало тени. Дальше Мибама рекомендуется идти с местным гидом."},"steps":[{"t":{"ar":"صعودًا في الوادي","en":"Up the wadi","de":"Das Wadi hinauf","fr":"Remontée du wadi","ru":"Вверх по вади"},"d":{"ar":"امشِ صعودًا على طريق الوادي أو دروب المزارع المجاورة له، بين مزارع النخيل والموز التي ترويها قنوات الأفلاج.","en":"Walk up the wadi road or the farm paths beside it, through date and banana plantations fed by falaj channels.","de":"Geh die Wadi-Straße oder die Feldwege daneben hinauf, durch Dattel- und Bananenplantagen, die von Falaj-Kanälen bewässert werden.","fr":"Remontez le wadi par la route ou par les chemins agricoles qui la longent, à travers des plantations de dattiers et de bananiers irriguées par des canaux de falaj.","ru":"Идите вверх по дороге вдоль вади или по соседним фермерским тропам через финиковые и банановые плантации, которые орошаются каналами фаладжей."},"tm":[15,20,"m"]},{"t":{"ar":"أزقة القرى","en":"Village lanes","de":"Dorfgassen","fr":"Ruelles des villages","ru":"Деревенские улочки"},"d":{"ar":"مُرّ بقرى صغيرة مثل سيوة. تمر الأزقة قرب البيوت، فامشِ بهدوء واحترام.","en":"Pass through small villages such as Siwa. The lanes go close to homes, so walk quietly and respectfully.","de":"Du kommst durch kleine Dörfer wie Siwa. Die Gassen führen dicht an Häusern vorbei, also geh leise und respektvoll.","fr":"Traversez de petits villages comme Siwa. Les ruelles passent tout près des maisons : marchez discrètement et avec respect.","ru":"Вы пройдёте через небольшие деревни, например Сиву. Улочки проходят рядом с домами, поэтому ведите себя тихо и уважительно."},"tm":[20,30,"m"]},{"t":{"ar":"سفح الجبل إلى مبام","en":"Hillside to Mibam","de":"Über die Hänge nach Mibam","fr":"Coteaux jusqu’à Mibam","ru":"По склону до Мибама"},"d":{"ar":"يعبر المقطع الأخير إلى مبام، في أعمق جزء من الوادي، سفوحًا صخرية شديدة الانحدار. المسار ليس معلَّمًا بوضوح دائمًا.","en":"The last stretch to Mibam, at the deepest part of the gorge, crosses steep rocky hillsides. The route is not always clearly marked.","de":"Das letzte Stück nach Mibam, am tiefsten Punkt der Schlucht, führt über steile, felsige Hänge. Die Route ist nicht überall klar markiert.","fr":"La dernière partie jusqu’à Mibam, au plus profond de la gorge, traverse des coteaux rocheux et raides. L’itinéraire n’est pas toujours bien balisé.","ru":"Последний отрезок до Мибама, в самой глубокой части ущелья, идёт по крутым скалистым склонам. Маршрут не везде чётко обозначен."},"tm":[30,45,"m"]},{"t":{"ar":"الدرجات إلى البرك","en":"Steps to the pools","de":"Stufen zu den Pools","fr":"Marches vers les vasques","ru":"Ступени к заводям"},"d":{"ar":"من مبام، انزل سلسلة طويلة من الدرجات عبر المزارع إلى البرك الخضراء والشلال.","en":"From Mibam, walk down a long flight of steps through the farms to the green pools and the waterfall.","de":"Geh von Mibam eine lange Treppe durch die Felder hinunter zu den grünen Pools und dem Wasserfall.","fr":"Depuis Mibam, descendez un long escalier à travers les cultures jusqu’aux vasques vertes et à la cascade.","ru":"Из Мибама спуститесь по длинной лестнице через фермы к зелёным заводям и водопаду."},"tm":[15,20,"m"]}]},"khalid":{"access":{"ar":"من مسقط، اسلك الطريق 23 باتجاه الكامل، وانعطف عند تقاطع وادي بني خالد المشار إليه باللوحات، على بعد نحو 2.5–3 ساعات من مسقط. الطريق معبد حتى الموقف، وفيه مطعم ودورات مياه وغرف لتبديل الملابس. اضبط الملاحة على الموقف، لا على اسم الوادي فقط.","en":"From Muscat, take Highway 23 towards Al Kamil and turn off at the signposted Wadi Bani Khalid junction, about 2.5–3 hours from Muscat. The road is paved to the car park, which has a restaurant, toilets and changing rooms. Navigate to the car park, not just the wadi name.","de":"Nimm von Muscat den Highway 23 Richtung Al Kamil und fahr an der ausgeschilderten Abzweigung zum Wadi Bani Khalid ab, etwa 2,5–3 Stunden von Muscat. Die Straße ist bis zum Parkplatz asphaltiert, dort gibt es ein Restaurant, Toiletten und Umkleiden. Navigier zum Parkplatz, nicht nur zum Namen des Wadis.","fr":"Depuis Mascate, prenez l’autoroute 23 en direction d’Al Kamil et sortez à l’embranchement indiqué « Wadi Bani Khalid », à environ 2 h 30 – 3 h de Mascate. La route est goudronnée jusqu’au parking, qui dispose d’un restaurant, de toilettes et de vestiaires. Entrez le parking dans votre GPS, pas seulement le nom du wadi.","ru":"Из Маската езжайте по шоссе 23 в сторону Эль-Камиля и сверните на развязке с указателем на вади Бани-Халид, примерно в 2,5–3 часах езды от Маската. Асфальт идёт до самой парковки, где есть ресторан, туалеты и раздевалки. Прокладывайте маршрут в навигаторе до парковки, а не просто до названия вади."},"back":{"ar":"عُد من الطريق نفسه مرورًا بالبرك إلى الموقف.","en":"Return the same way past the pools to the car park.","de":"Geh denselben Weg an den Pools vorbei zurück zum Parkplatz.","fr":"Revenez par le même chemin en longeant les vasques jusqu’au parking.","ru":"Возвращайтесь тем же путём мимо заводей к парковке."},"tip":{"ar":"البس لباسًا محتشمًا حتى أثناء السباحة، وارتدِ أحذية مائية للمقاطع الصخرية بعد البرك الرئيسية.","en":"Dress modestly, even when swimming, and wear water shoes for the rocky sections beyond the main pools.","de":"Kleide dich zurückhaltend, auch beim Schwimmen, und trag Wasserschuhe für die felsigen Abschnitte hinter den Hauptpools.","fr":"Portez une tenue correcte, même pour vous baigner, et des chaussures aquatiques pour les passages rocheux au-delà des vasques principales.","ru":"Одевайтесь скромно, даже когда купаетесь, и наденьте обувь для воды на каменистые участки за главными заводями."},"steps":[{"t":{"ar":"إلى البرك الأولى","en":"To the first pools","de":"Zu den ersten Pools","fr":"Vers les premières vasques","ru":"К первым заводям"},"d":{"ar":"امشِ في الممر المعبد المستوي بجانب الفلج حتى البرك الفيروزية الكبيرة الأولى.","en":"Walk the flat paved path beside a falaj to the first large turquoise pools.","de":"Geh den flachen, befestigten Weg neben einem Falaj zu den ersten großen türkisfarbenen Pools.","fr":"Suivez le sentier plat et goudronné le long d’un falaj jusqu’aux premières grandes vasques turquoise.","ru":"Идите по ровной мощёной дорожке вдоль фаладжа к первым большим бирюзовым заводям."},"tm":[5,10,"m"]},{"t":{"ar":"البرك والشلال","en":"Pools and waterfall","de":"Pools und Wasserfall","fr":"Vasques et cascade","ru":"Заводи и водопад"},"d":{"ar":"تابع فوق الصخور الملساء مرورًا بالبركة الثانية، ثم انزل بعض الدرجات إلى بركة أكبر يغذيها شلال.","en":"Continue over smooth rock past the second pool, then down some steps to a larger pool fed by a waterfall.","de":"Weiter über glatten Fels am zweiten Pool vorbei, dann ein paar Stufen hinunter zu einem größeren Pool, der von einem Wasserfall gespeist wird.","fr":"Continuez sur la roche lisse en passant la deuxième vasque, puis descendez quelques marches jusqu’à une vasque plus grande alimentée par une cascade.","ru":"Пройдите по гладким камням мимо второй заводи, затем спуститесь по ступеням к большей заводи, которую питает водопад."},"tm":[10,15,"m"]},{"t":{"ar":"أعلى الوادي","en":"Upper canyon","de":"Oberer Canyon","fr":"Canyon supérieur","ru":"Верхний каньон"},"d":{"ar":"يضيق الوادي في ممر قصير ماؤه صافٍ جدًا، وينتهي عند جسر معدني صغير.","en":"The wadi narrows into a short canyon with very clear water, ending at a small metal bridge.","de":"Das Wadi verengt sich zu einem kurzen Canyon mit sehr klarem Wasser, der an einer kleinen Metallbrücke endet.","fr":"Le wadi se resserre en un court canyon à l’eau très claire, qui se termine à une petite passerelle métallique.","ru":"Вади сужается в короткий каньон с очень прозрачной водой, который заканчивается у небольшого металлического мостика."},"tm":[5,10,"m"]},{"t":{"ar":"عبور الجدول","en":"Stream crossings","de":"Bachquerungen","fr":"Passages du ruisseau","ru":"Переходы через ручей"},"d":{"ar":"اعبر الجدول على الحجارة، واتبع دربًا صخريًا فيه عبور آخر.","en":"Cross the stream on stepping stones and follow a rocky path with another crossing.","de":"Überquere den Bach über Trittsteine und folge einem felsigen Pfad mit einer weiteren Querung.","fr":"Traversez le ruisseau sur des pierres de gué et suivez un sentier rocailleux avec une autre traversée.","ru":"Перейдите ручей по камням и идите по каменистой тропе, где будет ещё один переход."},"tm":[10,15,"m"]},{"t":{"ar":"كهف مقل","en":"Moqal Cave","de":"Moqal-Höhle","fr":"Grotte de Moqal","ru":"Пещера Мукал"},"d":{"ar":"اصعد الدرج الخرساني إلى مدخل الكهف. أحضر مصباحًا يدويًا إذا أردت النظر إلى داخله.","en":"Climb the concrete stairs to the cave entrance. Bring a torch if you want to look inside.","de":"Steig die Betontreppe zum Höhleneingang hinauf. Nimm eine Taschenlampe mit, wenn du hineinschauen willst.","fr":"Montez l’escalier en béton jusqu’à l’entrée de la grotte. Prenez une lampe si vous voulez regarder à l’intérieur.","ru":"Поднимитесь по бетонной лестнице ко входу в пещеру. Если хотите заглянуть внутрь, возьмите фонарик."},"tm":[5,10,"m"]}]},"arbeieen":{"access":{"ar":"من مسقط، اسلك الطريق 17 باتجاه صور، واخرج عند التقاطع المشار إليه لوادي الأربعين، على بعد نحو ساعة ونصف من مسقط. الجزء الأخير درب حصوي ضيق شديد الانحدار (نحو 20 دقيقة)، ويُنصح بسيارة مرتفعة أو دفع رباعي. اركن في مكان واسع على جانب الطريق بعد المخاضة الضحلة.","en":"From Muscat, take Highway 17 towards Sur and leave at the signposted junction for Wadi Al Arbeieen, about 1.5 hours from Muscat. The last part is a steep, narrow gravel track (about 20 minutes); a high-clearance car or 4x4 is recommended. Park at a wide roadside spot after the shallow ford.","de":"Nimm von Muscat den Highway 17 Richtung Sur und fahr an der ausgeschilderten Ausfahrt zum Wadi Al Arbeieen ab, etwa 1,5 Stunden von Muscat. Das letzte Stück ist eine steile, schmale Schotterpiste (ca. 20 Minuten); ein Auto mit hoher Bodenfreiheit oder ein Allradfahrzeug (4x4) wird empfohlen. Park nach der flachen Furt an einer breiten Stelle am Straßenrand.","fr":"Depuis Mascate, prenez l’autoroute 17 en direction de Sour et sortez à l’embranchement indiqué pour le Wadi Al Arbeieen, à environ 1 h 30 de Mascate. La dernière partie est une piste de gravier étroite et raide (environ 20 minutes) ; une voiture à garde au sol élevée ou un 4x4 est recommandé. Garez-vous à un endroit large au bord de la piste, après le gué peu profond.","ru":"Из Маската езжайте по шоссе 17 в сторону Сура и сверните на развязке с указателем на вади Эль-Арбаин, примерно в 1,5 часа езды от Маската. Последний участок — крутая узкая грунтовка (около 20 минут); рекомендуется машина с высоким клиренсом или внедорожник. Оставьте машину на широкой обочине после мелкого брода."},"back":{"ar":"عُد من الطريق نفسه، ثم انزل بالسيارة على الدرب الحصوي ببطء وانتبه للسيارات الصاعدة.","en":"Return the same way, then drive the gravel track down slowly and watch for cars coming up.","de":"Geh denselben Weg zurück, fahr dann die Schotterpiste langsam hinunter und achte auf entgegenkommende Autos.","fr":"Revenez par le même chemin, puis redescendez la piste de gravier lentement en faisant attention aux voitures qui montent.","ru":"Возвращайтесь тем же путём, затем медленно спускайтесь на машине по грунтовке и следите за встречными машинами."},"tip":{"ar":"هذا الوادي الضيق تجري فيه السيول بسرعة: لا تدخله أبدًا بعد أمطار غزيرة أو عند توقع المطر.","en":"This narrow wadi floods quickly: never enter after heavy rain or when rain is forecast.","de":"Dieses enge Wadi wird schnell überflutet: Geh niemals nach starkem Regen hinein oder wenn Regen vorhergesagt ist.","fr":"Ce wadi étroit se remplit très vite en cas de crue : n’y entrez jamais après de fortes pluies ou quand de la pluie est annoncée.","ru":"Это узкое вади быстро затапливается: никогда не заходите в него после сильного дождя или если ожидается дождь."},"steps":[{"t":{"ar":"البركة الزمردية الأولى","en":"First emerald pool","de":"Erster smaragdgrüner Pool","fr":"Première vasque émeraude","ru":"Первая изумрудная заводь"},"d":{"ar":"من الموقف، اتبع الدرب الحصوي ثم انعطف يمينًا إلى مسار يؤدي إلى بركة خضراء صافية.","en":"From the parking, follow the gravel path and turn right onto a trail to a clear green pool.","de":"Folge vom Parkplatz dem Schotterweg und bieg rechts auf einen Pfad zu einem klaren grünen Pool ab.","fr":"Depuis le parking, suivez le chemin de gravier puis tournez à droite sur un sentier menant à une vasque d’un vert limpide.","ru":"От парковки идите по гравийной дороге и сверните направо на тропу к прозрачной зелёной заводи."},"tm":[5,10,"m"]},{"t":{"ar":"الفلج والنخيل","en":"Falaj and palms","de":"Falaj und Palmen","fr":"Falaj et palmiers","ru":"Фаладж и пальмы"},"d":{"ar":"اصعد الدرب الصخري، ثم اتبع الفلج عبر مزرعة نخيل مع إطلالات على الجبال.","en":"Climb the rocky path, then follow the falaj through a date plantation with mountain views.","de":"Steig den felsigen Pfad hinauf und folge dann dem Falaj durch eine Dattelplantage mit Blick auf die Berge.","fr":"Montez le sentier rocailleux, puis suivez le falaj à travers une palmeraie avec vue sur les montagnes.","ru":"Поднимитесь по каменистой тропе, затем идите вдоль фаладжа через финиковую плантацию с видом на горы."},"tm":[15,20,"m"]},{"t":{"ar":"التسلق بين الصخور","en":"Boulder scramble","de":"Kraxeln über Felsblöcke","fr":"Passage dans les rochers","ru":"Лазание по валунам"},"d":{"ar":"انزل من الفلج واتبع أكوام الحجارة المتفرقة فوق صخور زلقة.","en":"Drop down from the falaj and follow the occasional cairns over slippery boulders.","de":"Steig vom Falaj hinunter und folge den vereinzelten Steinmännchen über rutschige Felsblöcke.","fr":"Descendez du falaj et suivez les quelques cairns sur des rochers glissants.","ru":"Спуститесь от фаладжа и, ориентируясь на редкие туры, пробирайтесь по скользким валунам."},"tm":[15,20,"m"]},{"t":{"ar":"البرك الوسطى","en":"Middle pools","de":"Mittlere Pools","fr":"Vasques intermédiaires","ru":"Средние заводи"},"d":{"ar":"مُرّ ببركة صافية ضحلة وشلال صغير، واعبر في ماء يصل إلى الكاحل.","en":"Pass a shallow clear pool and a small cascade, crossing in ankle-deep water.","de":"Du kommst an einem flachen, klaren Pool und einer kleinen Kaskade vorbei und watest durch knöcheltiefes Wasser.","fr":"Passez une vasque claire et peu profonde et une petite cascade, en traversant dans l’eau jusqu’aux chevilles.","ru":"Пройдите мимо мелкой прозрачной заводи и небольшого каскада, переходя воду по щиколотку."},"tm":[10,15,"m"]},{"t":{"ar":"بركة الشلال","en":"Waterfall pool","de":"Pool mit Wasserfall","fr":"Vasque de la cascade","ru":"Заводь с водопадом"},"d":{"ar":"تصل إلى البركة الرئيسية، وفيها ماء عميق للسباحة وشلال صغير.","en":"Reach the main pool, with deep water for swimming and a small waterfall.","de":"Du erreichst den Hauptpool mit tiefem Wasser zum Schwimmen und einem kleinen Wasserfall.","fr":"Vous atteignez la vasque principale, profonde, où l’on peut nager, avec une petite cascade.","ru":"Вы дойдёте до главной заводи с глубокой водой для купания и небольшим водопадом."},"tm":[5,10,"m"]}]},"mutrah":{"access":{"ar":"في مسقط، سر على كورنيش مطرح حتى طرفه الشرقي قرب قلعة مطرح واركن في مكان قريب. يبدأ المسار (C38) من زقاق بعد مدخل القلعة مباشرة. يمكن الوصول بأي سيارة.","en":"In Muscat, drive along the Mutrah Corniche to its east end near Mutrah Fort and park nearby. The trail (C38) starts in a lane just past the fort entrance. Any car can get there.","de":"Fahr in Muscat die Mutrah Corniche entlang bis zu ihrem östlichen Ende beim Mutrah Fort und park in der Nähe. Der Weg (C38) beginnt in einer Gasse kurz hinter dem Eingang zur Festung. Du kommst mit jedem Auto hin.","fr":"À Mascate, longez la corniche de Mutrah jusqu’à son extrémité est, près du fort de Mutrah, et garez-vous à proximité. Le sentier (C38) part d’une ruelle juste après l’entrée du fort. Toute voiture peut s’y rendre.","ru":"В Маскате проедьте по набережной Матраха до её восточного конца у форта Матрах и оставьте машину поблизости. Тропа (C38) начинается в переулке сразу за входом в форт. Добраться можно на любой машине."},"back":{"ar":"امشِ نحو 1 كم غربًا على الكورنيش عائدًا إلى مطرح، أو خذ سيارة أجرة.","en":"Walk about 1 km west along the Corniche back to Mutrah, or take a taxi.","de":"Geh etwa 1 km westwärts die Corniche entlang zurück nach Mutrah oder nimm ein Taxi.","fr":"Marchez environ 1 km vers l’ouest le long de la corniche pour revenir à Mutrah, ou prenez un taxi.","ru":"Пройдите около 1 км на запад по набережной обратно в Матрах или возьмите такси."},"tip":{"ar":"لا يوجد ظل على المسار: اذهب في الصباح الباكر أو في آخر العصر، والبس حذاءً جيد الثبات.","en":"There is no shade on the trail: go early in the morning or late in the afternoon, and wear shoes with good grip.","de":"Auf dem Weg gibt es keinen Schatten: Geh früh morgens oder am späten Nachmittag und trag Schuhe mit gutem Grip.","fr":"Il n’y a pas d’ombre sur le sentier : partez tôt le matin ou en fin d’après-midi, et portez des chaussures qui accrochent bien.","ru":"На тропе нет тени: идите рано утром или ближе к вечеру и наденьте обувь с хорошим сцеплением."},"steps":[{"t":{"ar":"بداية المسار قرب قلعة مطرح","en":"Trailhead near Mutrah Fort","de":"Ausgangspunkt beim Mutrah Fort","fr":"Départ près du fort de Mutrah","ru":"Начало тропы у форта Матрах"},"d":{"ar":"اصعد الزقاق إلى بداية المسار C38 واتبع علامات الطلاء الأصفر والأبيض والأحمر. تتقاطع عدة دروب هنا، فتحقق من العلامات عند كل تقاطع.","en":"Go up the lane to the C38 start and follow the yellow-white-red marks. Several paths cross here, so check the marks at every junction.","de":"Geh die Gasse hinauf zum Start von C38 und folge den gelb-weiß-roten Markierungen. Hier kreuzen sich mehrere Wege, also prüf die Markierungen an jeder Abzweigung.","fr":"Montez la ruelle jusqu’au départ du C38 et suivez les marques jaune-blanc-rouge. Plusieurs sentiers se croisent ici : vérifiez les marques à chaque bifurcation.","ru":"Поднимитесь по переулку к началу C38 и следуйте жёлто-бело-красной маркировке. Здесь пересекается несколько троп, поэтому сверяйтесь с маркировкой на каждой развилке."},"tm":[10,15,"m"]},{"t":{"ar":"مجرى الوادي","en":"Wadi bed","de":"Wadi-Bett","fr":"Lit du wadi","ru":"Русло вади"},"d":{"ar":"مُرّ باحترام بجانب مقبرة صغيرة، واصعد في مجرى الوادي الصخري.","en":"Pass respectfully by a small cemetery and walk up the rocky stream bed.","de":"Geh respektvoll an einem kleinen Friedhof vorbei und dann das felsige Bachbett hinauf.","fr":"Passez avec respect devant un petit cimetière et remontez le lit rocailleux du torrent.","ru":"С уважением пройдите мимо небольшого кладбища и поднимайтесь по каменистому руслу ручья."},"tm":[30,45,"m"]},{"t":{"ar":"أطلال القرية القديمة","en":"Old village ruins","de":"Ruinen des alten Dorfs","fr":"Ruines d’un ancien village","ru":"Руины старой деревни"},"d":{"ar":"مُرّ بأطلال قرية قديمة مهجورة فيها بئر مكشوفة: ابتعد عن حافتها.","en":"Pass the ruins of an old abandoned village with an uncovered well: keep away from its edge.","de":"Du kommst an den Ruinen eines alten, verlassenen Dorfs mit einem offenen Brunnen vorbei: Halte Abstand zu seinem Rand.","fr":"Passez devant les ruines d’un ancien village abandonné, où se trouve un puits non couvert : restez à l’écart de son bord.","ru":"Вы пройдёте мимо руин старой заброшенной деревни с открытым колодцем: держитесь подальше от его края."},"tm":[15,20,"m"]},{"t":{"ar":"الصعود إلى قمة التل","en":"Climb to the ridge","de":"Aufstieg zum Grat","fr":"Montée vers la crête","ru":"Подъём на гребень"},"d":{"ar":"اصعد أرضًا صخرية شديدة الانحدار حتى قمة التل، مع إطلالات على ميناء مطرح والكورنيش.","en":"Climb steep rocky ground to the ridge, with views over Mutrah harbour and the Corniche.","de":"Steig über steiles, felsiges Gelände zum Grat hinauf, mit Blick über den Hafen von Mutrah und die Corniche.","fr":"Grimpez un terrain rocheux et raide jusqu’à la crête, avec vue sur le port de Mutrah et la corniche.","ru":"Поднимитесь по крутому каменистому склону на гребень, откуда видны гавань Матраха и набережная."},"tm":[20,30,"m"]},{"t":{"ar":"النزول إلى حديقة ريام","en":"Down to Riyam Park","de":"Hinab zum Riyam Park","fr":"Descente vers le parc de Riyam","ru":"Спуск к парку Рийам"},"d":{"ar":"انزل على درجات صخرية كبيرة نحو نُصب المبخرة الضخم، وأنهِ المسار عند حديقة ريام.","en":"Descend large rock steps towards the giant incense-burner monument and finish at Riyam Park.","de":"Steig über große Felsstufen Richtung des riesigen Weihrauchbrenner-Monuments ab und beende die Tour im Riyam Park.","fr":"Descendez de grandes marches rocheuses vers le monument géant en forme de brûle-encens et terminez au parc de Riyam.","ru":"Спуститесь по большим каменным ступеням к огромному памятнику-курильнице и закончите маршрут в парке Рийам."},"tm":[15,25,"m"]}]},"habib":{"access":{"ar":"من نزوى، اتجه إلى بركة الموز ثم اصعد إلى نقطة تفتيش الجبل الأخضر (بعدها للدفع الرباعي فقط). تابع بعد سيق، واتبع اللوحات إلى وادي بني حبيب، واركن في نهاية الطريق بعد القرية الحديثة.","en":"From Nizwa, drive to Birkat Al Mawz and up to the Jebel Akhdar checkpoint (4x4 only beyond it). Continue past Saiq, follow the signs to Wadi Bani Habib, and park at the end of the road past the modern village.","de":"Fahr von Nizwa nach Birkat Al Mawz und hinauf zum Jebel-Akhdar-Kontrollpunkt (dahinter nur Allradfahrzeuge/4x4). Fahr weiter an Saiq vorbei, folge den Schildern zum Wadi Bani Habib und park am Ende der Straße hinter dem modernen Dorf.","fr":"Depuis Nizwa, rejoignez Birkat Al Mawz puis montez jusqu’au poste de contrôle du Jebel Akhdar (4x4 uniquement au-delà). Dépassez Saiq, suivez les panneaux vers le Wadi Bani Habib et garez-vous au bout de la route, après le village moderne.","ru":"Из Низвы доедьте до Биркат-эль-Мауза и поднимитесь к посту на Джебель-Ахдар (дальше — только на внедорожнике). Проезжайте Сайк, следуйте указателям на вади Бани-Хабиб и оставьте машину в конце дороги за новой деревней."},"back":{"ar":"انزل عائدًا إلى الوادي، ثم اصعد الدرجات الحجرية إلى الموقف.","en":"Go back down to the wadi and climb the stone steps up to the car park.","de":"Geh wieder hinunter ins Wadi und steig die Steinstufen hinauf zum Parkplatz.","fr":"Redescendez dans le wadi et remontez l’escalier de pierre jusqu’au parking.","ru":"Спуститесь обратно в вади и поднимитесь по каменным ступеням к парковке."},"tip":{"ar":"لا تدخل الوادي إذا كان المطر محتملًا. بعض المباني ما زالت تُستخدم مساجد أو مخازن، فلا تدخلها.","en":"Do not enter the wadi if rain is likely. Some buildings are still used as mosques or stores, so do not go inside them.","de":"Geh nicht ins Wadi, wenn Regen wahrscheinlich ist. Einige Gebäude werden noch als Moscheen oder Lager genutzt, also betritt sie nicht.","fr":"N’entrez pas dans le wadi si de la pluie est probable. Certains bâtiments servent encore de mosquées ou d’entrepôts : n’y entrez pas.","ru":"Не заходите в вади, если возможен дождь. Некоторые здания до сих пор используются как мечети или склады, поэтому не заходите внутрь."},"steps":[{"t":{"ar":"درجات حجرية إلى الوادي","en":"Stone steps into the gorge","de":"Steinstufen in die Schlucht","fr":"Marches de pierre vers la gorge","ru":"Каменные ступени в ущелье"},"d":{"ar":"من الموقف، انزل الدرجات الحجرية المتعرجة إلى وادٍ ضيق تظلله أشجار الجوز.","en":"From the car park, walk down the winding stone steps into a narrow gorge shaded by walnut trees.","de":"Geh vom Parkplatz die gewundenen Steinstufen hinunter in eine enge Schlucht, die von Walnussbäumen beschattet wird.","fr":"Depuis le parking, descendez l’escalier de pierre sinueux jusqu’à une gorge étroite ombragée par des noyers.","ru":"От парковки спуститесь по извилистым каменным ступеням в узкое ущелье в тени грецких орехов."},"tm":[10,15,"m"]},{"t":{"ar":"بساتين الجوز والفلج","en":"Walnut groves and falaj","de":"Walnusshaine und Falaj","fr":"Noyeraies et falaj","ru":"Ореховые рощи и фаладж"},"d":{"ar":"امشِ تحت أشجار الجوز مرورًا بمدرجات قديمة وبمحاذاة فلج جارٍ، مستخدمًا الدرجات لعبوره.","en":"Walk under the walnut trees past old terraces and along a flowing falaj, using the steps to cross it.","de":"Geh unter den Walnussbäumen an alten Terrassen vorbei und entlang eines fließenden Falaj, den du über die Stufen überquerst.","fr":"Marchez sous les noyers, devant d’anciennes terrasses et le long d’un falaj où l’eau coule, en utilisant les marches pour le traverser.","ru":"Идите под ореховыми деревьями мимо старых террас и вдоль текущего фаладжа, переходя его по ступеням."},"tm":[15,20,"m"]},{"t":{"ar":"القرية القديمة الأولى","en":"The first old village","de":"Das erste alte Dorf","fr":"Le premier vieux village","ru":"Первая старая деревня"},"d":{"ar":"اصعد إلى القرية الحجرية المهجورة على سفح التل. الدرجات غير مستوية وبعض الجدران متهدمة.","en":"Climb up to the abandoned stone village on the hillside. Steps are uneven and some walls have fallen.","de":"Steig hinauf zum verlassenen Steindorf am Hang. Die Stufen sind uneben und einige Mauern sind eingestürzt.","fr":"Montez jusqu’au village de pierre abandonné à flanc de colline. Les marches sont irrégulières et certains murs se sont effondrés.","ru":"Поднимитесь к заброшенной каменной деревне на склоне. Ступени неровные, некоторые стены обрушились."},"tm":[20,30,"m"]},{"t":{"ar":"القرية العليا","en":"The upper village","de":"Das obere Dorf","fr":"Le village du haut","ru":"Верхняя деревня"},"d":{"ar":"اصعد الدرج المنحوت في الصخر إلى الجزء الأعلى من القرية، مع إطلالة جميلة على القرية الأولى.","en":"Climb the rock-cut stairs to the higher part of the village, with a good view back over the first one.","de":"Steig die in den Fels gehauenen Stufen zum höher gelegenen Teil des Dorfs hinauf, mit schönem Blick zurück auf das erste.","fr":"Montez l’escalier taillé dans la roche jusqu’à la partie haute du village, avec une belle vue sur le premier.","ru":"Поднимитесь по вырубленной в скале лестнице в верхнюю часть деревни, откуда хорошо видна первая."},"tm":[20,30,"m"]}]},"darbat":{"access":{"ar":"من صلالة، اتجه شرقًا على طريق طاقة (نحو 35–40 كم)، ثم انعطف نحو الداخل قرب طاقة إلى الطريق المعبد المؤدي إلى وادي دربات. يمكن الوصول بأي سيارة، والوقوف قرب البحيرة مجاني.","en":"From Salalah, drive east on the road to Taqah (about 35–40 km) and turn inland near Taqah onto the paved road to Wadi Darbat. Any car can get there, and parking by the lake is free.","de":"Fahr von Salalah ostwärts auf der Straße nach Taqah (ca. 35–40 km) und bieg bei Taqah ins Landesinnere auf die asphaltierte Straße zum Wadi Darbat ab. Du kommst mit jedem Auto hin, und das Parken am See ist kostenlos.","fr":"Depuis Salalah, prenez vers l’est la route de Taqah (environ 35 à 40 km) et tournez vers l’intérieur des terres près de Taqah sur la route goudronnée menant au Wadi Darbat. Toute voiture peut s’y rendre, et le parking près du lac est gratuit.","ru":"Из Салалы езжайте на восток по дороге на Таку (около 35–40 км) и у Таки сверните вглубь суши на асфальтированную дорогу к вади Дарбат. Добраться можно на любой машине, парковка у озера бесплатная."},"back":{"ar":"امشِ عائدًا عكس اتجاه الجريان على الدرب نفسه إلى الموقف.","en":"Walk back upstream along the same path to the car park.","de":"Geh auf demselben Weg flussaufwärts zurück zum Parkplatz.","fr":"Remontez vers l’amont par le même chemin jusqu’au parking.","ru":"Возвращайтесь вверх по течению той же тропой к парковке."},"tip":{"ar":"لا تسبح ولا تخُض الماء، فالتيارات قد تكون خطرة. في يوليو وأغسطس يكون المكان مزدحمًا جدًا، فاحضر مبكرًا.","en":"Do not swim or wade: currents can be dangerous. In July and August it is very crowded, so arrive early.","de":"Nicht schwimmen oder waten: Die Strömungen können gefährlich sein. Im Juli und August ist es sehr voll, komm also früh.","fr":"Ne vous baignez pas et n’entrez pas dans l’eau : les courants peuvent être dangereux. En juillet et en août, il y a énormément de monde : arrivez tôt.","ru":"Не купайтесь и не заходите в воду: течения могут быть опасными. В июле и августе здесь очень многолюдно, поэтому приезжайте пораньше."},"steps":[{"t":{"ar":"موقف البحيرة","en":"Lake parking","de":"Parkplatz am See","fr":"Parking du lac","ru":"Парковка у озера"},"d":{"ar":"ابدأ من الموقف قرب البحيرة. في موسم الخريف يمكن استئجار القوارب وقوارب الكاياك هنا.","en":"Start at the car park by the lake. In the khareef season, boats and kayaks can be hired here.","de":"Starte am Parkplatz am See. In der Khareef-Saison kannst du hier Boote und Kajaks mieten.","fr":"Partez du parking près du lac. Pendant la saison du khareef, on peut y louer des bateaux et des kayaks.","ru":"Начните с парковки у озера. В сезон хариф здесь можно взять напрокат лодку или каяк."},"tm":[5,10,"m"]},{"t":{"ar":"على شاطئ البحيرة","en":"Along the lakeshore","de":"Am Seeufer entlang","fr":"Le long du lac","ru":"По берегу озера"},"d":{"ar":"امشِ على الشاطئ المستوي وراقب الطيور والأسماك والجمال في الماء. قد تكون الأرض موحلة في الخريف.","en":"Walk the flat shore and look out for birds, fish and camels in the water. It can be muddy in khareef.","de":"Geh das flache Ufer entlang und halte Ausschau nach Vögeln, Fischen und Kamelen im Wasser. Im Khareef kann es schlammig sein.","fr":"Longez la rive plate et observez les oiseaux, les poissons et les dromadaires dans l’eau. Le terrain peut être boueux pendant le khareef.","ru":"Идите по ровному берегу и высматривайте птиц, рыб и верблюдов в воде. В хариф здесь бывает грязно."},"tm":[20,30,"m"]},{"t":{"ar":"مع مجرى النهر إلى الشلالات","en":"Downstream to the falls","de":"Flussabwärts zu den Fällen","fr":"Vers l’aval jusqu’aux chutes","ru":"Вниз по течению к водопаду"},"d":{"ar":"اتبع ضفة النهر مع اتجاه الجريان على الدروب الواضحة، مبتعدًا عن حافة الماء.","en":"Follow the river bank downstream on the obvious paths, keeping away from the water's edge.","de":"Folge dem Flussufer auf den gut erkennbaren Pfaden flussabwärts und halte Abstand zum Wasser.","fr":"Suivez la berge vers l’aval par les sentiers évidents, en restant à l’écart du bord de l’eau.","ru":"Идите по хорошо заметным тропам вдоль берега реки вниз по течению, держась подальше от кромки воды."},"tm":[20,30,"m"]},{"t":{"ar":"الشلال والكهوف","en":"Waterfall and caves","de":"Wasserfall und Höhlen","fr":"Cascade et grottes","ru":"Водопад и пещеры"},"d":{"ar":"تصل إلى أعلى الجرف المرتفع حيث يتدفق الشلال في الخريف. انظر إلى الكهوف في الجروف من أرض جافة وآمنة فقط.","en":"Reach the top of the high cliff where the waterfall flows in khareef. Look at the caves in the cliffs only from safe, dry ground.","de":"Du erreichst die Oberkante der hohen Klippe, über die im Khareef der Wasserfall stürzt. Schau dir die Höhlen in den Felswänden nur von sicherem, trockenem Boden aus an.","fr":"Vous atteignez le haut de la grande falaise d’où tombe la cascade pendant le khareef. N’observez les grottes de la falaise que depuis un sol sûr et sec.","ru":"Вы дойдёте до верха высокого обрыва, откуда в хариф падает водопад. Смотрите на пещеры в скалах только с безопасного сухого места."},"tm":[15,20,"m"]}]},"hajar":{"access":{"ar":"نقطة البداية العافية في فجوة سمائل، على بعد نحو 100 كم من مسقط على طريق نزوى. اذهب بسيارة أجرة، فلا تحتاج إلى سيارتك الخاصة. ابدأ عند الفجر، لأن اليوم الأول نحو 10 ساعات من المشي.","en":"The start is Al Afyah in the Sumail Gap, about 100 km from Muscat on the Nizwa road. Go by taxi; you do not need your own car. Start at dawn, because day 1 is about 10 hours of walking.","de":"Start ist Al Afyah in der Sumail Gap, etwa 100 km von Muscat an der Straße nach Nizwa. Fahr mit dem Taxi hin; ein eigenes Auto brauchst du nicht. Starte im Morgengrauen, denn Tag 1 umfasst etwa 10 Stunden Gehzeit.","fr":"Le départ se trouve à Al Afyah, dans la trouée de Sumail, à environ 100 km de Mascate sur la route de Nizwa. Allez-y en taxi : vous n’avez pas besoin de votre propre voiture. Partez à l’aube, car le premier jour compte environ 10 heures de marche.","ru":"Маршрут начинается в Эль-Афье в Сумаильском проходе, примерно в 100 км от Маската по дороге на Низву. Доберитесь на такси — своя машина не нужна. Выходите на рассвете, так как в первый день около 10 часов ходьбы."},"back":{"ar":"من يقاء، خذ سيارة أجرة إلى الرستاق، ثم حافلة إلى مسقط.","en":"From Yiqa, take a taxi to Rustaq, then a bus to Muscat.","de":"Nimm von Yiqa ein Taxi nach Rustaq und dann einen Bus nach Muscat.","fr":"Depuis Yiqa, prenez un taxi jusqu’à Rustaq, puis un bus jusqu’à Mascate.","ru":"Из Йики доберитесь на такси до Рустака, затем на автобусе до Маската."},"tip":{"ar":"جزء فقط من المسار معلَّم: حمّل مسارات GPX من الموقع الرسمي قبل الذهاب، أو استعن بمرشد. أفضل وقت من منتصف نوفمبر إلى مارس.","en":"Only part of the route is waymarked: load the GPX tracks from the official site before you go, or hire a guide. Best from mid-November to March.","de":"Nur ein Teil der Route ist markiert: Lade vorher die GPX-Tracks von der offiziellen Website herunter oder nimm dir einen Guide. Beste Zeit ist Mitte November bis März.","fr":"Seule une partie de l’itinéraire est balisée : chargez les traces GPX depuis le site officiel avant de partir, ou engagez un guide. Meilleure période : de mi-novembre à mars.","ru":"Маркирована лишь часть маршрута: перед выходом загрузите GPX-треки с официального сайта или наймите гида. Лучшее время — с середины ноября по март."},"steps":[{"t":{"ar":"من فجوة سمائل إلى الصوجرة","en":"Sumail Gap to As Sawjrah","de":"Sumail Gap bis As Sawjrah","fr":"De la trouée de Sumail à As Sawjrah","ru":"От Сумаильского прохода до Эс-Сауджры"},"d":{"ar":"العافية، حدش، وكان، الصوجرة (نحو 30 كم). صعود ونزول كبيران بين قرى جبلية فيها مياه موثوقة.","en":"Al Afyah, Hadash, Wukan, As Sawjrah (about 30 km). Big climbs and descents between mountain villages with reliable water.","de":"Al Afyah, Hadash, Wukan, As Sawjrah (ca. 30 km). Große Auf- und Abstiege zwischen Bergdörfern mit verlässlichen Wasserstellen.","fr":"Al Afyah, Hadash, Wukan, As Sawjrah (environ 30 km). De fortes montées et descentes entre des villages de montagne où l’eau est fiable.","ru":"Эль-Афья, Хадаш, Вукан, Эс-Сауджра (около 30 км). Большие подъёмы и спуски между горными деревнями с надёжными источниками воды."},"tm":[3,3,"d"]},{"t":{"ar":"من الصوجرة إلى مسفاة العبريين","en":"As Sawjrah to Misfat al Abriyyin","de":"As Sawjrah bis Misfat al Abriyyin","fr":"D’As Sawjrah à Misfat al Abriyyin","ru":"От Эс-Сауджры до Мисфат-эль-Абрийина"},"d":{"ar":"الصوجرة، الروس، الشرف، مسفاة العبريين (نحو 46 كم) على دروب الحمير القديمة، وينتهي في قرية مسفاة ذات المدرجات وبيوت الضيافة.","en":"As Sawjrah, Ar Rus, Ash Sharaf, Misfat (about 46 km) on old donkey tracks, ending in the terraced village of Misfat with guesthouses.","de":"As Sawjrah, Ar Rus, Ash Sharaf, Misfat (ca. 46 km) auf alten Eselspfaden, mit Ziel im Terrassendorf Misfat mit Gästehäusern.","fr":"As Sawjrah, Ar Rus, Ash Sharaf, Misfat (environ 46 km) sur d’anciens chemins muletiers, pour finir au village en terrasses de Misfat, qui compte des maisons d’hôtes.","ru":"Эс-Сауджра, Эр-Рус, Эш-Шараф, Мисфат (около 46 км) по старым ослиным тропам; финиш в террасной деревне Мисфат с гостевыми домами."},"tm":[3,3,"d"]},{"t":{"ar":"من مسفاة إلى هضبة جبل شمس","en":"Misfat to the Jebel Shams plateau","de":"Misfat bis zur Jebel-Shams-Hochebene","fr":"De Misfat au plateau du Jebel Shams","ru":"От Мисфата до плато Джебель-Шамс"},"d":{"ar":"مسفاة، حيل الشص، منطقة قمة جبل شمس (تخييم بري)، ثم الهضبة. لا توجد مياه موثوقة في الأعالي: احمل 6 لترات أو أكثر.","en":"Misfat, Hayl Ash Shas, the Jebel Shams summit area (wild camp), then the plateau. No reliable water high up: carry 6 litres or more.","de":"Misfat, Hayl Ash Shas, das Gipfelgebiet des Jebel Shams (Wildcamp), dann die Hochebene. Weiter oben gibt es kein verlässliches Wasser: Nimm 6 Liter oder mehr mit.","fr":"Misfat, Hayl Ash Shas, la zone du sommet du Jebel Shams (bivouac), puis le plateau. Pas d’eau fiable en altitude : emportez 6 litres ou plus.","ru":"Мисфат, Хайль-эш-Шас, район вершины Джебель-Шамс (дикий лагерь), затем плато. Наверху нет надёжных источников воды: несите 6 литров или больше."},"tm":[3,3,"d"]},{"t":{"ar":"مسار كرب الدائري","en":"Kurb loop","de":"Kurb-Runde","fr":"Boucle de Kurb","ru":"Кольцо от Курба"},"d":{"ar":"من طريق كرب إلى يساب، ثم نقا الرويس (تخييم بري) والعودة إلى كرب. مسار دائري ناءٍ يعود إلى الطريق.","en":"From the Kurb road to Yisab, then Naqa Ar Ruways (wild camp) and back to Kurb. A remote loop that returns to a road.","de":"Von der Kurb-Straße nach Yisab, dann Naqa Ar Ruways (Wildcamp) und zurück nach Kurb. Eine abgelegene Runde, die wieder an eine Straße führt.","fr":"De la route de Kurb à Yisab, puis Naqa Ar Ruways (bivouac) et retour à Kurb. Une boucle isolée qui revient à une route.","ru":"От дороги у Курба до Йисаба, затем Нака-эр-Рувайс (дикий лагерь) и обратно в Курб. Удалённое кольцо, которое возвращается к дороге."},"tm":[3,3,"d"]},{"t":{"ar":"المرحلة البرية إلى يقاء","en":"Wilderness stage to Yiqa","de":"Wildnisetappe nach Yiqa","fr":"Étape sauvage jusqu’à Yiqa","ru":"Дикий участок до Йики"},"d":{"ar":"دان السنين، غيل شاذان، دار الرويس، ثم يقاء (نحو 59 كم). أربعة أيام في أودية نائية مع تخييم بري.","en":"Daan As Sanin, Ghayl Shadhan, Dar Ar Ruways, then Yiqa (about 59 km). Four days in remote wadis with wild camps.","de":"Daan As Sanin, Ghayl Shadhan, Dar Ar Ruways, dann Yiqa (ca. 59 km). Vier Tage in abgelegenen Wadis mit Wildcamps.","fr":"Daan As Sanin, Ghayl Shadhan, Dar Ar Ruways, puis Yiqa (environ 59 km). Quatre jours dans des wadis isolés, avec bivouacs.","ru":"Даан-эс-Санин, Гайль-Шадан, Дар-эр-Рувайс, затем Йика (около 59 км). Четыре дня в удалённых вади с дикими лагерями."},"tm":[4,4,"d"]}]}};
function rgTime(tm){ const u=T("rg_u")[tm[2]]; return (tm[0]===tm[1]?`${tm[0]}`:`${tm[0]}–${tm[1]}`)+" "+u; }
function openRoute(id){
  const t=TRAILS.find(x=>x.id===id), r=ROUTES[id]; if(!t||!r) return;
  const host=t.guide?new URL(t.guide).hostname.replace(/^www\./,""):"";
  $("#rg-body").innerHTML=`<div class="rg-head"><div><small>${T("route_guide")}</small><h2>${esc(L(t.name))}</h2></div>
      <button type="button" class="rg-x" id="rg-x" aria-label="${T("rg_close")}">✕</button></div>
    <span class="rg-off">✓ ${T("rg_off")}</span>
    <h3>${T("rg_access")}</h3><p>${esc(L(r.access))}</p>
    <h3>${T("rg_steps")}</h3>
    <ol class="rg-steps">${r.steps.map(s=>`<li><div class="rg-st"><b>${esc(L(s.t))}</b><span class="rg-tm">${rgTime(s.tm)}</span></div><p>${esc(L(s.d))}</p></li>`).join("")}</ol>
    <p class="muted-s">${T("rg_note")}</p>
    <h3>${T("rg_back")}</h3><p>${esc(L(r.back))}</p>
    <div class="rg-tip"><b>${T("rg_tip")}:</b> ${esc(L(r.tip))}</div>
    ${t.guide?`<a class="gbtn" target="_blank" rel="noopener" href="${t.guide}">${T("rg_more")} <span dir="ltr">${host}</span> <small>(${T("rg_net")})</small></a>`:""}`;
  $("#rg-x").onclick=closeRoute;
  $("#rg").hidden=false; $("#rg-body").scrollTop=0; document.body.style.overflow="hidden";
}
function closeRoute(){ $("#rg").hidden=true; document.body.style.overflow=""; }
$("#rg").addEventListener("click",e=>{ if(e.target.id==="rg") closeRoute(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !$("#rg").hidden) closeRoute(); });

const CK_KEY="maraqi-trip", CK_GRACE=120; /* minutes added after the expected return */
let ckTimer=null;
const ckGet=()=>{ try{ return JSON.parse(localStorage.getItem(CK_KEY)||"null"); }catch(e){ return null; } };
const ckSet=v=>{ try{ v?localStorage.setItem(CK_KEY,JSON.stringify(v)):localStorage.removeItem(CK_KEY); }catch(e){} };
const ckClock=ts=>{ const d=new Date(ts); return clock(d.getHours()*60+d.getMinutes()); };
const ckDigits=s=>String(s||"").replace(/\D/g,"").replace(/^00/,"");
function ckWa(num,text,holder){ waOpen(`https://wa.me/${num||""}?text=${encodeURIComponent(text)}`, holder); }
function ckStart(){
  const t=TRAILS.find(x=>x.id===$("#c-trail").value);
  if(!t||!window.lastCalcMins){ $("#ck-msg").textContent=T("ck_needcalc"); return; }
  const num=ckDigits($("#ck-num").value); try{ localStorage.setItem("maraqi-contact",num); }catch(e){}
  const now=Date.now(), end=now+window.lastCalcMins*60000, dead=end+CK_GRACE*60000;
  const trip={id:t.id,start:now,end,dead,num};
  ckSet(trip); $("#ck-msg").textContent="";
  ckWa(num,T("ck_msg_start")(L(t.name),ckClock(now),ckClock(end),ckClock(dead),t.ll?"https://www.google.com/maps/search/?api=1&query="+t.ll:""),$("#ck-msg"));
  ckRender();
}
function ckFinish(){
  const trip=ckGet(); if(!trip) return;
  const t=TRAILS.find(x=>x.id===trip.id);
  ckSet(null); ckRender();
  $("#ck-bye").hidden=false; $("#ck-bye").textContent=T("ck_bye"); setTimeout(()=>{$("#ck-bye").hidden=true;},30000);
  ckWa(trip.num,T("ck_msg_done")(t?L(t.name):"",ckClock(Date.now())),$("#ck-bye"));
}
function ckRender(){
  const trip=ckGet(), bar=$("#ck-bar");
  clearInterval(ckTimer);
  if(!trip){ bar.hidden=true; bar.className=""; return; }
  const t=TRAILS.find(x=>x.id===trip.id), now=Date.now();
  const state=now>trip.dead?"over":now>trip.end?"late":"ok";
  bar.hidden=false; bar.className="ck-"+state;
  bar.innerHTML=`<div class="ck-top"><b>${state==="over"?"⚠ ":"🥾 "}${T("ck_active")}: ${esc(t?L(t.name):"")}</b>
      <button type="button" class="ck-cancel" id="ck-cancel">${T("ck_cancel")}</button></div>
    <div class="ck-times">${T("ck_exp")} <b>${ckClock(trip.end)}</b> · ${T("ck_dead")} <b>${ckClock(trip.dead)}</b></div>
    ${state==="late"?`<p class="ck-warn">${T("ck_late")}</p>`:""}${state==="over"?`<p class="ck-warn">${T("ck_over")}</p>`:""}
    <div class="ck-acts"><button type="button" class="ck-done" id="ck-done">✓ ${T("ck_done")}</button>
      ${state==="over"?`<button type="button" class="ck-help" id="ck-help">${T("ck_help")}</button>`:""}</div>`;
  $("#ck-done").onclick=ckFinish;
  $("#ck-cancel").onclick=()=>{ if(confirm(T("ck_cancel_q"))){ ckSet(null); ckRender(); } };
  if($("#ck-help")) $("#ck-help").onclick=()=>{ show("sos"); window.scrollTo({top:0,behavior:"smooth"}); };
  ckTimer=setInterval(()=>{ const s2=Date.now()>trip.dead?"over":Date.now()>trip.end?"late":"ok"; if(s2!==state){ ckRender(); if(s2==="over"&&navigator.vibrate) navigator.vibrate([400,200,400]); } },30000);
}
function renderCheckin(){
  $("#ck-num").placeholder=T("ck_ph");
  if(!$("#ck-num").value){ try{ $("#ck-num").value=localStorage.getItem("maraqi-contact")||""; }catch(e){} }
  ckRender();
}
$("#ck-start").addEventListener("click",ckStart);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) ckRender(); });

function renderBackup(){

  $("#ck-bk-list").querySelectorAll("button").forEach(b=>b.onclick=()=>{ $("#ck-num").value="+"+b.dataset.n; renderBackup(); });
}

function waOpen(url, holder){
  try{ const a=document.createElement("a"); a.href=url; a.target="_blank"; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove(); }catch(e){}
  if(holder){
    const keep=holder.id==="ck-bye"?`<span>${esc(T("ck_bye"))}</span><br>`:"";
    holder.innerHTML=`${keep}<a class="wa-fb" href="${url}" target="_blank" rel="noopener">${esc(T("wa_fb"))}</a>`;
    holder.hidden=false;
  }
}
